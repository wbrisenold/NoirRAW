[package]
name = "noirraw"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Native Rust + Metal RAW photo editor with color-managed LUTs"

[dependencies]
slint = { version = "=1.18.1", features = ["unstable-wgpu-30", "renderer-femtovg-wgpu", "live-preview"] }
zenraw = { version = "0.2", features = ["rawler"] }
enough = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "bmp", "webp"] }
bytemuck = { version = "1.23", features = ["derive"] }
rfd = "0.15"
csv = "1.3"
walkdir = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6"
pollster = "0.4"
rusqlite = { version = "0.32", features = ["bundled", "modern_sqlite"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = { version = "0.10", features = ["std"] }
kamadak-exif = "0.6"
img_hash = "3.0"
ort = { version = "=2.0.0-rc.13", optional = true }
ndarray = { version = "0.16", optional = true }
tokenizers = { version = "0.23", optional = true }
rayon = "1.8"
parking_lot = "0.12"
quick-xml = { version = "0.42", features = ["serialize"] }
tracing = "0.1"
log = "0.4"
reqwest = { version = "0.12", features = ["json", "blocking"] }
hex = "0.4"
# exif = { version = "0.7", optional = true }  # abandoned, using kamadak-exif instead

[features]
default = []
face-recognition = ["ort", "ndarray", "tokenizers"]

[build-dependencies]
slint-build = "=1.18.1"
